services:
  web:
    build: .
    env_file: .env
    environment:
      MAKAGENT_DATA_DIR: /data
    ports:
      - "127.0.0.1:8082:8000"
    volumes:
      - makagent-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':os.environ.get('PUBLIC_BASE_URL','http://localhost:8082').split('://')[-1],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  makagent-data:
